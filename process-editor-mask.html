<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>委托流程编辑器</title>
  <style>
    :root { color-scheme: dark; --panel:#181d24; --line:#303844; --muted:#99a5b5; --text:#edf2f7; --accent:#69a7ff; --danger:#ff7070; --ok:#66d29b; --mask-select-height:38px; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; font:14px/1.5 "Microsoft YaHei"; color:var(--text); background:transparent; }
    body { display:flex; align-items:center; justify-content:center; }
    button,input,select,textarea { font:inherit; color:inherit; }
    .app { width:min(1440px,92vw); height:min(850px,88vh); display:grid; grid-template-rows:auto 1fr; background:#101318; border:1px solid #3a4553; box-shadow:0 18px 70px #000; border-radius:8px; overflow:hidden; }
    .top { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
    .title { font-size:18px; font-weight:700; margin-right:auto; }
    .hint { color:var(--muted); font-size:12px; }
    .label { color:var(--muted); font-size:13px; }
    .btn { border:1px solid var(--line); background:#252c36; padding:7px 13px; border-radius:7px; cursor:pointer; }
    .btn:hover,.mode .active { border-color:var(--accent); }
    .primary { background:#286bc6; border-color:#4d91ee; }
    .danger,.required:after { color:var(--danger); }
    .required:after { content:" *"; }
    .layout { min-height:0; display:grid; grid-template-columns:320px 1fr 390px; }
    .side,.inspect { overflow:auto; padding:14px; background:var(--panel); }
    .side { display:flex; flex-direction:column; border-right:1px solid var(--line); }
    .inspect { border-left:1px solid var(--line); }
    .main { min-width:0; overflow:auto; padding:16px; }
    .label { display:block; margin:12px 0 5px; }
    .form-line { display:grid; grid-template-columns:64px minmax(0,1fr); align-items:center; gap:8px; margin-top:9px; }
    .form-label { color:var(--muted); font-size:13px; line-height:1.2; white-space:nowrap; }
    .form-line>.input,.form-line>.editable-select,.form-line>.mask-select { width:100%; min-width:0; }
    .form-line>.mask-select .mask-select-button { width:100%; }
    .form-actions { display:flex; gap:8px; margin-top:9px; }
    .form-actions>.btn { flex:1; white-space:nowrap; }
    .input { width:100%; min-height:38px; border:1px solid var(--line); border-radius:6px; background:#0f141a; padding:8px 10px; outline:none; }
    .input:hover { border-color:#485667; }
    .input:focus { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
    select.input { cursor:pointer; appearance:none; padding-right:34px; background-image:linear-gradient(45deg,transparent 50%,#9aa6b6 50%),linear-gradient(135deg,#9aa6b6 50%,transparent 50%); background-position:calc(100% - 17px) 16px,calc(100% - 12px) 16px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
    .editable-select { position:relative; }
    .editable-select .input { padding-right:36px; }
    .editable-toggle { position:absolute; top:0; right:0; width:34px; height:38px; border:0; background:transparent; cursor:pointer; }
    .editable-toggle:before,.editable-toggle:after { content:""; position:absolute; top:17px; width:7px; height:2px; background:#9aa6b6; }
    .editable-toggle:before { left:11px; transform:rotate(45deg); }
    .editable-toggle:after { right:10px; transform:rotate(-45deg); }
    .editable-select.open .editable-toggle:before { transform:rotate(-45deg); }
    .editable-select.open .editable-toggle:after { transform:rotate(45deg); }
    .editable-options { position:absolute; z-index:20; top:calc(100% + 4px); left:0; right:0; max-height:220px; overflow:auto; margin:0; padding:4px; list-style:none; border:1px solid var(--line); border-radius:6px; background:#0f141a; box-shadow:0 10px 28px rgba(0,0,0,.45); }
    .editable-option { padding:8px 10px; border-radius:4px; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .editable-option:hover,.editable-option.active { background:#286bc6; color:#fff; }
    .editable-empty { padding:8px 10px; color:var(--muted); }
    .row,.mode { display:flex; gap:8px; }
    .row>* ,.mode>* { min-width:0; flex:1; }
    .path { color:var(--muted); font-size:12px; word-break:break-all; margin:10px 0; }
    .recent-section { min-height:120px; flex:1 1 auto; overflow:auto; margin-top:4px; padding-top:10px; border-top:1px solid var(--line); }
    .recent-title { margin-bottom:7px; color:var(--muted); font-size:12px; }
    .recent-files { display:flex; flex-direction:column; gap:6px; }
    .recent-file { width:100%; min-width:0; display:block; padding:8px 9px; border:1px solid transparent; border-radius:6px; color:var(--text); background:#11161c; text-align:left; cursor:pointer; }
    .recent-file:hover,.recent-file:focus-visible { border-color:var(--accent); outline:none; }
    .recent-file strong,.recent-file small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .recent-file strong { font-size:12px; }
    .recent-file small { margin-top:2px; color:var(--muted); font-size:10px; }
    .recent-empty { padding:14px 4px; color:var(--muted); font-size:11px; text-align:center; }
    .steps { display:flex; flex-direction:column; gap:10px; }
    .step { display:grid; grid-template-columns:38px 1fr auto; align-items:center; gap:10px; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:10px; cursor:pointer; }
    .step.active { border-color:var(--accent); }
    .step.drag-before { border-top:3px solid var(--accent); }
    .step.drag-after { border-bottom:3px solid var(--accent); }
    .drag-handle { width:28px; height:34px; display:grid; grid-template-columns:repeat(2,4px); grid-template-rows:repeat(3,4px); gap:4px; align-content:center; justify-content:center; cursor:grab; border:0; background:transparent; }
    .drag-handle:active { cursor:grabbing; }
    .drag-handle i { width:4px; height:4px; border-radius:50%; background:var(--muted); }
    .step-type { font-weight:700; }
    .note { color:var(--muted); }
    .actions { display:flex; gap:5px; }
    .mini { border:0; background:#29313c; border-radius:5px; padding:5px 8px; cursor:pointer; }
    .empty { padding:50px; text-align:center; color:var(--muted); }
    .json { width:100%; min-height:100px; resize:vertical; border:1px solid var(--line); border-radius:6px; background:#0c1117; padding:9px; font:12px/1.5 Consolas; }
    .status { max-width:420px; max-height:72px; overflow:auto; white-space:pre-wrap; color:var(--muted); }
    .status.ok { color:var(--ok); }
    .status.warning { color:#f0c36a; }
    .status.error { color:var(--danger); }
    .field-note { color:var(--muted); font-size:11px; margin-top:3px; }
    .field-head { display:flex; align-items:end; gap:8px; }
    .field-head .label { flex:1; }
    .field-label-content { display:inline-flex; align-items:baseline; gap:6px; }
    .field-key { color:var(--muted); font:11px/1.2 Consolas,monospace; font-weight:400; opacity:.7; }
    .array-row,.loc-row { display:grid; grid-template-columns:1fr auto auto auto; gap:6px; margin-bottom:6px; }
    .loc-row { grid-template-columns:1fr 1fr 1fr auto; }
    .icon { width:32px; padding:6px; }
    .optional-bar { display:flex; gap:8px; margin:14px 0 4px; }
    .optional-bar .input { min-width:0; flex:1; }
    .optional-bar .btn { min-width:58px; flex:0 0 auto; white-space:nowrap; }
    .data-record-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; }
    .step-picker { display:flex; align-items:center; gap:8px; }
    .step-picker>.form-label { flex:0 0 64px; }
    .step-picker>.mask-select,.step-picker>.input { width:auto; min-width:0; }
    .step-picker>.btn { flex:0 0 auto; }
    .side-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:auto; padding-top:16px; }
    .side-actions .btn { min-width:0; white-space:nowrap; }
    .key-data-grid { display:grid; grid-template-columns:64px minmax(0,1fr); align-items:center; gap:8px; }
    .key-data-grid .label { margin:0; }
    .role-editor { display:flex; flex-direction:column; gap:2px; }
    .role-editable { width:100%; min-width:0; }
    .role-editable .editable-options { z-index:30; }
    .wave-card,.branch-card { margin-top:10px; padding:10px; border:1px solid var(--line); border-radius:7px; background:#11161c; }
    .wave-number { width:86px; margin-left:auto; }
    .wave-route { display:grid; grid-template-columns:76px minmax(0,1fr) auto; gap:6px; margin:7px 0; }
    .branch-title { margin-bottom:8px; font-weight:700; }
    .branch-title span { margin-left:5px; color:var(--muted); font-size:11px; font-weight:400; }
    .branch-card>[data-branch-data] { margin-top:8px; }
    .nested-field { margin-top:8px; }
    .nested-field .label { margin-top:0; }
    .branch-empty { max-width:none; margin-top:10px; }
    .modal-backdrop { position:fixed; z-index:100; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.62); }
    .modal { width:min(420px,calc(100vw - 40px)); padding:20px; border:1px solid #465365; border-radius:8px; background:var(--panel); box-shadow:0 18px 60px rgba(0,0,0,.65); }
    .modal-title { margin:0 0 8px; font-size:17px; }
    .modal-message { margin:0 0 18px; color:var(--muted); white-space:pre-wrap; }
    .modal-actions { display:flex; justify-content:flex-end; gap:8px; }
    .app.modal-locked { pointer-events:none; }
    .hidden { display:none !important; }
  </style>
  <link rel="stylesheet" href="./mask-select.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="title">委托流程编辑器</div>
      <span class="hint">按 ~ 隐藏 / 显示</span>
      <div id="status" class="status">正在加载...</div>
      <button class="btn" id="close">关闭</button>
    </header>
    <div class="layout">
      <aside class="side">
        <div class="mode"><button id="existingMode" class="btn active">现有委托</button><button id="newMode" class="btn">新增委托</button></div>
        <div id="existingFields">
          <div class="form-line"><label class="form-label">国家</label><select id="countrySelect" class="input"></select></div>
          <div class="form-line"><label class="form-label">类型</label><select id="typeSelect" class="input"></select></div>
          <div class="form-line"><label class="form-label">委托</label><select id="commissionSelect" class="input"></select></div>
          <div class="form-line"><label class="form-label">地点</label><select id="locationSelect" class="input"></select></div>
        </div>
        <div id="newFields" class="hidden">
          <div class="form-line"><label class="form-label required">国家</label><div id="countryCombo" class="editable-select"><input id="country" class="input" autocomplete="off" placeholder="蒙德" role="combobox" aria-autocomplete="list" aria-expanded="false"><button class="editable-toggle" type="button" tabindex="-1" aria-label="展开国家选项"></button><ul class="editable-options hidden" role="listbox"></ul></div></div>
          <div class="form-line"><label class="form-label required">类型</label><select id="type" class="input"><option>NPC</option><option>Basic</option></select></div>
          <div class="form-line"><label class="form-label required">地点目录</label><div id="locationCombo" class="editable-select"><input id="location" class="input" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false"><button class="editable-toggle" type="button" tabindex="-1" aria-label="展开地点选项"></button><ul class="editable-options hidden" role="listbox"></ul></div></div>
          <div class="form-line"><label class="form-label required">委托名</label><input id="commission" class="input"></div>
        </div>
        <div class="form-line"><label class="form-label required">流程文件</label><input id="existingFile" class="input" value="process.json" readonly><input id="fileName" class="input hidden" value="process.json"></div>
        <div id="loadActions" class="form-actions"><button id="load" class="btn">打开</button></div>
        <div id="path" class="path"></div>
        <section class="recent-section"><div class="recent-title">最近打开</div><div id="recentFiles" class="recent-files"></div></section>
        <div class="side-actions"><button class="btn" id="validate">校验</button><button class="btn primary" id="save" disabled>保存</button></div>
      </aside>
      <main class="main">
        <div class="step-picker"><label class="form-label">步骤类型</label><select id="newType" class="input"></select><button id="add" class="btn primary">添加步骤</button><button id="clearSteps" class="btn danger">清除</button></div>
        <div style="height:12px"></div><div id="steps" class="steps"></div>
      </main>
      <aside class="inspect"><div id="editor" class="empty">选择一个步骤进行编辑</div></aside>
    </div>
  </div>
  <div id="confirmModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal">
      <h2 id="confirmTitle" class="modal-title">未保存的修改</h2>
      <p id="confirmMessage" class="modal-message"></p>
      <div class="modal-actions"><button id="confirmCancel" class="btn" type="button">取消</button><button id="confirmAccept" class="btn primary" type="button">确认</button></div>
    </div>
  </div>
  <script src="./mask-select.js"></script>
  <script src="./process-editor-mask.js"></script>
</body>
</html>
