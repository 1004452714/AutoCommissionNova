<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>步骤参数布局方案</title>
    <style>
        :root {
            color-scheme: dark;
            --page: #0e1116;
            --panel: #141920;
            --surface: #181d24;
            --raised: #202630;
            --border: #313a47;
            --border-strong: #4a5768;
            --text: #edf2f7;
            --muted: #9aa7b7;
            --primary: #4d8dff;
            --error: #ff7474;
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; margin: 0; }
        body { display:grid; place-items:start center; padding:20px; background:var(--page); color:var(--text); font:14px/1.5 "Microsoft YaHei","Segoe UI",sans-serif; }
        button, input, select, textarea { min-height:36px; border:1px solid var(--border); border-radius:6px; background:var(--raised); color:var(--text); font:inherit; }
        button { padding:0 12px; cursor:pointer; }
        button:hover { border-color:var(--border-strong); background:#29313d; }
        input, select, textarea { width:100%; min-width:0; padding:7px 10px; outline:0; }
        textarea { min-height:88px; resize:vertical; }
        select { appearance:none; padding-right:32px; background-color:var(--raised); background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 16px) 15px,calc(100% - 11px) 15px; background-repeat:no-repeat; background-size:5px 5px; }
        :focus-visible { outline:2px solid var(--primary); outline-offset:2px; }

        .prototype { width:min(560px,96vw); }
        .variants { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin-bottom:10px; }
        .variants button { overflow:hidden; padding:0 8px; text-overflow:ellipsis; white-space:nowrap; }
        .variants button.active { border-color:var(--primary); background:var(--primary); color:white; }
        .inspector { min-height:720px; padding:14px; overflow:auto; border:1px solid var(--border); border-radius:8px; background:var(--panel); box-shadow:0 14px 42px rgba(0,0,0,.42); }
        .direct-fields { display:grid; gap:10px; margin-bottom:12px; }
        .field { display:grid; gap:5px; min-width:0; }
        .label { display:flex; align-items:baseline; gap:6px; color:#cbd3dd; font-size:12px; }
        .label small { color:var(--muted); font:11px/1.2 Consolas,monospace; }
        .label.required span::after { content:" *"; color:var(--error); }
        .note-row { grid-template-columns:88px minmax(0,1fr); align-items:center; }
        .note-row .label { font-size:13px; }
        .cards { display:grid; gap:10px; }
        details { overflow:hidden; border:1px solid var(--border); border-radius:7px; background:var(--surface); }
        summary { min-height:42px; display:flex; align-items:center; gap:8px; padding:0 11px; cursor:pointer; list-style:none; user-select:none; }
        summary::-webkit-details-marker { display:none; }
        summary::before { content:"+"; width:18px; color:var(--muted); font-size:18px; text-align:center; }
        details[open]>summary::before { content:"−"; }
        summary strong { font-size:14px; }
        summary small { color:var(--muted); font:11px Consolas,monospace; }
        summary .summary-meta { margin-left:auto; color:var(--muted); font-size:11px; }
        .card-body { display:grid; gap:10px; padding:12px; border-top:1px solid var(--border); }
        .common-grid { display:grid; gap:10px; }
        .retry-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:8px; }
        .loc-block { display:grid; gap:7px; }
        .loc-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .segmented { display:flex; gap:4px; }
        .segmented button { min-height:30px; padding:0 9px; }
        .segmented button.active { border-color:var(--primary); background:rgba(77,141,255,.2); }
        .loc-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
        .optional-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px; padding-top:2px; }
        .data-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px; align-items:end; }
        .dialog-data { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .dialog-field { min-width:0; display:grid; gap:6px; }
        .dialog-field header { display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .dialog-field header button { min-height:28px; height:28px; padding:0 8px; }
        .dialog-data .optional-row { grid-column:1 / -1; }
        .danger { color:var(--error); }

        .style-b details { border-radius:4px; }
        .style-b summary { min-height:38px; background:var(--raised); }
        .style-b summary::before { order:3; margin-left:2px; }
        .style-b summary .summary-meta { margin-left:auto; }
        .style-b .card-body { padding:14px 12px; background:var(--panel); }
        .style-b .common-grid { grid-template-columns:1fr 1fr; }
        .style-b .loc-block, .style-b .optional-row { grid-column:1 / -1; }

        .style-c .cards { gap:7px; }
        .style-c details { border:0; border-left:3px solid var(--border-strong); border-radius:0 6px 6px 0; }
        .style-c details[open] { border-left-color:var(--primary); }
        .style-c summary { background:#171c23; }
        .style-c summary::before { order:4; margin-left:4px; }
        .style-c .card-body { border-top:0; padding:8px 12px 13px; }
        .style-c .direct-fields { padding:0 0 2px 12px; border-left:3px solid var(--primary); }

        .style-d .inspector-content { border:1px solid var(--border); border-radius:6px; }
        .style-d .direct-fields { gap:0; margin:0; }
        .style-d .direct-fields .field { min-height:48px; grid-template-columns:126px minmax(0,1fr); align-items:center; padding:6px 10px; border-bottom:1px solid var(--border); }
        .style-d .cards { gap:0; }
        .style-d details { border:0; border-radius:0; background:transparent; }
        .style-d details+details { border-top:1px solid var(--border); }
        .style-d summary { background:var(--surface); }
        .style-d .card-body { padding:0; border-top:1px solid var(--border); }
        .style-d .common-grid>.field, .style-d .loc-block, .style-d .retry-row, .style-d .optional-row, .style-d .data-row { padding:8px 10px; border-bottom:1px solid var(--border); }
        .style-d .common-grid>.field { grid-template-columns:116px minmax(0,1fr); align-items:center; }
        .style-d .optional-row, .style-d .data-row { border-bottom:0; }

        .style-e .inspector { padding:18px; }
        .style-e details { border-color:transparent; background:transparent; }
        .style-e details[open] { border-color:var(--border); background:rgba(24,29,36,.58); }
        .style-e summary { padding:0 4px; border-bottom:1px solid var(--border); }
        .style-e details[open]>summary { margin:0 10px; }
        .style-e summary::before { order:4; margin-left:4px; }
        .style-e .card-body { border:0; }
        .style-e .optional-row { padding-top:9px; border-top:1px dashed var(--border-strong); }
        .style-e .direct-fields { padding-bottom:12px; border-bottom:1px solid var(--border); }

        @media (max-width:620px) {
            body { padding:8px; }
            .variants { grid-template-columns:repeat(2,minmax(0,1fr)); }
            .inspector { min-height:0; }
            .style-b .common-grid { grid-template-columns:1fr; }
            .style-b .loc-block, .style-b .optional-row { grid-column:auto; }
            .retry-row, .loc-row, .dialog-data { grid-template-columns:1fr; }
            .dialog-data .optional-row { grid-column:auto; }
        }
    </style>
</head>
<body>
    <main class="prototype">
        <nav class="variants" aria-label="布局方案">
            <button type="button" data-style="a">A 线框</button>
            <button class="active" type="button" data-style="b">B 标题条</button>
            <button type="button" data-style="c">C 侧边线</button>
            <button type="button" data-style="d">D 属性表</button>
            <button type="button" data-style="e">E 极简</button>
        </nav>

        <aside class="inspector style-b" aria-label="步骤参数预览">
            <div class="inspector-content">
                <section class="direct-fields">
                    <label class="field note-row">
                        <span class="label"><span>步骤说明</span><small>note</small></span>
                        <input value="与凯瑟琳完成对话">
                    </label>
                    <label class="field">
                        <span class="label required"><span>步骤类型</span><small>type</small></span>
                        <select><option>对话</option><option>地图追踪</option><option>自动战斗</option></select>
                    </label>
                </section>

                <section class="cards">
                    <details open>
                        <summary><strong>通用字段</strong><small>common</small><span class="summary-meta">4 项</span></summary>
                        <div class="card-body common-grid">
                            <label class="field">
                                <span class="label"><span>委托描述</span><small>desc</small></span>
                                <input value="描述中包含目标文本时执行">
                            </label>
                            <section class="loc-block">
                                <div class="loc-head">
                                    <span class="label"><span>地址检测</span><small>loc</small></span>
                                    <div class="segmented"><button class="active" type="button">单点</button><button type="button">多点</button></div>
                                </div>
                                <div class="loc-row"><input type="number" value="120.5" aria-label="坐标 x"><input type="number" value="248.3" aria-label="坐标 y"><input type="number" value="12" aria-label="距离阈值"></div>
                            </section>
                            <div class="retry-row">
                                <label class="field"><span class="label"><span>重试次数</span><small>retry</small></span><input type="number" value="2"></label>
                                <label class="field"><span class="label"><span>重试条件</span><small>retryOn</small></span><select><option>仅异常时</option><option>返回失败时</option><option>全部失败</option></select></label>
                            </div>
                            <div class="optional-row"><select aria-label="选择可选字段"><option>选择可选字段</option><option>委托描述 (desc)</option><option>地址检测 (loc)</option></select><button type="button">添加字段</button></div>
                        </div>
                    </details>

                    <details open>
                        <summary><strong>步骤数据</strong><small>data</small><span class="summary-meta">对话 · 2 项</span></summary>
                        <div class="card-body">
                            <div class="dialog-data">
                                <label class="dialog-field">
                                    <header><span class="label"><span>优先对话选项</span><small>priorityOptions</small></span><button class="danger" type="button">移除</button></header>
                                    <textarea>关于今天的委托
我来帮忙</textarea>
                                </label>
                                <label class="dialog-field">
                                    <header><span class="label"><span>NPC 白名单</span><small>npcWhiteList</small></span><button class="danger" type="button">移除</button></header>
                                    <textarea>凯瑟琳
安东尼</textarea>
                                </label>
                                <div class="optional-row"><select aria-label="选择可选数据字段"><option>选择可选数据字段</option><option>优先对话选项 (priorityOptions)</option><option>NPC 白名单 (npcWhiteList)</option></select><button type="button">添加字段</button></div>
                            </div>
                        </div>
                    </details>
                </section>
            </div>
        </aside>
    </main>

    <script>
        // 方案按钮只切换原型样式，不修改任何业务字段。
        const inspector = document.querySelector(".inspector");
        // 所有方案按钮共享单选状态。
        const variantButtons = Array.from(document.querySelectorAll("[data-style]"));
        // 切换当前预览方案并同步选中态。
        function selectVariant(button) {
            inspector.className = `inspector style-${button.dataset.style}`;
            variantButtons.forEach((item) => item.classList.toggle("active", item === button));
        }
        variantButtons.forEach((button) => button.addEventListener("click", () => selectVariant(button)));

        // 单点和多点按钮在每个方案中保持互斥选中。
        document.querySelectorAll(".segmented button").forEach((button) => button.addEventListener("click", () => {
            button.parentElement.querySelectorAll("button").forEach((item) => item.classList.toggle("active", item === button));
        }));
    </script>
</body>
</html>
