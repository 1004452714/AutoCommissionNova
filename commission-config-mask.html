<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>委托配置工具</title>
  <script defer src="./vendor/alpinejs-3.15.12.min.js"></script>
  <style>
    :root {
      --bg-page: rgba(0, 0, 0, 0.3);
      --bg-shell: rgba(20, 20, 20, 0.72);
      --bg-panel: rgba(28, 28, 28, 0.92);
      --bg-soft: rgba(255, 255, 255, 0.05);
      --bg-soft-hover: rgba(255, 255, 255, 0.08);
      --bg-active: rgba(50, 115, 220, 0.24);
      --border: rgba(255, 255, 255, 0.12);
      --border-strong: rgba(255, 255, 255, 0.2);
      --text-primary: #f2f2f2;
      --text-secondary: #c9c9c9;
      --text-muted: #8e8e8e;
      --accent: #4d8dff;
      --accent-strong: #2e6fe6;
      --success: #36b26d;
      --warning: #e3b341;
      --danger: #de5b5b;
      --radius: 12px;
      --radius-sm: 8px;
      --sidebar-width: 260px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background-color 0.2s;
    }

    [x-cloak] {
      display: none !important;
    }

    .shell {
      width: min(1380px, 90vw);
      height: min(840px, 84vh);
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-shell);
      backdrop-filter: blur(16px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
    }

    .sidebar-head {
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-tabs {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
      padding: 4px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 10px;
    }

    .sidebar-tab-btn {
      min-width: 0;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.16s, color 0.16s;
      white-space: nowrap;
    }

    .sidebar-tab-btn.active {
      background: var(--accent);
      color: #ffffff;
    }

    .search-input {
      width: 100%;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.24);
      color: var(--text-primary);
      padding: 0 10px;
      font-size: 13px;
    }

    .search-input:focus,
    .text-input:focus,
    .select-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .search-input::placeholder,
    .text-input::placeholder {
      color: var(--text-muted);
    }

    .commission-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px;
    }

    .commission-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      padding: 10px 12px;
      cursor: pointer;
      transition: background-color 0.16s, border-color 0.16s, color 0.16s;
      text-align: left;
      margin-bottom: 4px;
    }

    .commission-item:hover {
      background: var(--bg-soft-hover);
      color: var(--text-primary);
    }

    .commission-item.active {
      background: var(--bg-active);
      border-color: rgba(77, 141, 255, 0.6);
      color: #ffffff;
    }

    .commission-name {
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .commission-progress {
      flex-shrink: 0;
      font-size: 11px;
      color: inherit;
      opacity: 0.8;
    }

    .list-section {
      margin-bottom: 6px;
    }

    .list-section-head {
      width: 100%;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid transparent;
      border-bottom-color: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      background: transparent;
      color: var(--text-primary);
      padding: 0 8px;
      cursor: pointer;
      text-align: left;
      transition: background-color 0.16s, border-color 0.16s;
    }

    .list-section-head:hover,
    .list-section-head.open {
      background: rgba(255, 255, 255, 0.045);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .list-section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-size: 12px;
      font-weight: 700;
    }

    .chevron {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      position: relative;
      opacity: 0.72;
      transition: transform 0.16s, opacity 0.16s;
    }

    .chevron::before,
    .chevron::after {
      content: "";
      position: absolute;
      top: 6px;
      width: 7px;
      height: 1.5px;
      border-radius: 999px;
      background: var(--text-muted);
    }

    .chevron::before {
      left: 1px;
      transform: rotate(42deg);
    }

    .chevron::after {
      right: 1px;
      transform: rotate(-42deg);
    }

    .list-section-head.open .chevron {
      transform: rotate(180deg);
      opacity: 1;
    }

    .count-badge {
      flex-shrink: 0;
      min-width: 22px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(180, 194, 215, 0.12);
      color: #cbd5e3;
      font-size: 11px;
      font-weight: 600;
      padding: 0 7px;
    }

    .list-section-body {
      padding: 5px 0 7px 12px;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      margin-left: 14px;
    }

    .panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: rgba(20, 20, 20, 0.86);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.18);
    }

    .tabs {
      display: inline-flex;
      gap: 6px;
      padding: 4px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .tab-btn {
      min-width: 88px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.16s, color 0.16s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
    }

    .toolbar-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-left: auto;
      min-width: 0;
    }

    .toolbar-hint,
    .save-indicator {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .save-indicator.saving {
      color: var(--warning);
    }

    .save-indicator.saved {
      color: var(--success);
    }

    .save-indicator.error {
      color: var(--danger);
    }

    .btn {
      height: 34px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--bg-soft);
      color: var(--text-primary);
      font-size: 13px;
      cursor: pointer;
      transition: background-color 0.16s, border-color 0.16s, color 0.16s;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--bg-soft-hover);
      border-color: var(--border-strong);
    }

    .btn-primary {
      background: var(--success);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #2f985f;
      border-color: transparent;
    }

    .btn-accent {
      background: rgba(77, 141, 255, 0.15);
      color: #bcd2ff;
      border-color: rgba(77, 141, 255, 0.3);
    }

    .btn-accent:hover {
      background: rgba(77, 141, 255, 0.24);
      border-color: rgba(77, 141, 255, 0.48);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 22px 24px 24px;
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .page-head {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .page-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .section {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-soft);
      padding: 16px 18px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 14px;
    }

    .note-text {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.7;
      white-space: pre-line;
    }

    .hint-text {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .branch-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .branch-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.18);
    }

    .branch-item.completed .branch-desc {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .branch-desc {
      font-size: 13px;
      color: var(--text-primary);
      line-height: 1.5;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .toggle-label {
      font-size: 12px;
      color: var(--text-muted);
      min-width: 44px;
      text-align: right;
    }

    .toggle-label.completed {
      color: var(--success);
    }

    .switch {
      width: 42px;
      height: 24px;
      border-radius: 999px;
      border: 0;
      background: rgba(255, 255, 255, 0.16);
      cursor: pointer;
      position: relative;
      transition: background-color 0.16s;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      transition: transform 0.16s;
    }

    .switch.on {
      background: var(--success);
    }

    .switch.on::after {
      transform: translateX(18px);
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .global-field-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }

    .field-wide {
      grid-column: 1 / -1;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .text-input,
    .select-input {
      width: 100%;
      min-width: 0;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.24);
      color: var(--text-primary);
      padding: 0 10px;
      font-size: 13px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }

    .input-row .text-input {
      flex: 1;
    }

    .uid-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .uid-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .uid-row .text-input {
      flex: 1;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-soft);
      color: var(--text-primary);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      transition: background-color 0.16s, border-color 0.16s, color 0.16s;
    }

    .icon-btn:hover {
      background: var(--bg-soft-hover);
      border-color: var(--border-strong);
    }

    .icon-btn.danger {
      color: #ffb8b8;
    }

    .scope-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .scope-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(0, 0, 0, 0.16);
      padding: 16px 18px;
    }

    .scope-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .scope-title {
      min-width: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .locate-btn {
      flex: 0 0 auto;
      padding: 7px 12px;
    }

    .scope-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .config-block {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.03);
      padding: 14px;
    }

    .config-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .mode-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      margin-bottom: 12px;
    }

    .radio-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 1 1 112px;
      min-height: 32px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
      transition: background-color 0.16s, border-color 0.16s, color 0.16s;
    }

    .radio-pill input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .radio-pill:hover {
      background: var(--bg-soft-hover);
      color: var(--text-primary);
    }

    .radio-pill:focus-within {
      border-color: rgba(77, 141, 255, 0.55);
    }

    .radio-pill.active {
      background: rgba(77, 141, 255, 0.18);
      border-color: rgba(77, 141, 255, 0.3);
      color: #dbe7ff;
    }

    .radio-pill.active:hover {
      background: rgba(77, 141, 255, 0.24);
      border-color: rgba(77, 141, 255, 0.48);
    }

    .segment {
      display: inline-flex;
      gap: 6px;
      padding: 4px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 12px;
    }

    .segment button {
      min-width: 76px;
      height: 32px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .segment button.active {
      background: rgba(77, 141, 255, 0.18);
      color: #dbe7ff;
    }

    .role-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .empty {
      min-height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-muted);
      text-align: center;
      padding: 20px;
    }

    .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 18px;
      border-top: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.18);
      font-size: 12px;
      color: var(--text-muted);
    }

    .modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.56);
      padding: 24px;
      z-index: 30;
    }

    .modal-card {
      width: min(520px, 92vw);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(24, 24, 24, 0.96);
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .modal-body {
      padding: 14px 16px 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tree-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.18);
      overflow-y: auto;
      min-height: 260px;
      max-height: 52vh;
      padding: 8px;
    }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 34px;
      padding: 0 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      text-align: left;
      transition: background-color 0.16s, color 0.16s;
    }

    .tree-row:hover {
      background: var(--bg-soft-hover);
      color: var(--text-primary);
    }

    .tree-row.selected {
      background: var(--bg-active);
      color: #ffffff;
    }

    .tree-indent {
      flex-shrink: 0;
      width: 12px;
    }

    .tree-toggle {
      width: 14px;
      flex-shrink: 0;
      color: var(--text-muted);
      text-align: center;
    }

    .tree-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .error-text {
      font-size: 12px;
      color: var(--danger);
      line-height: 1.5;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    @media (max-width: 1180px) {
      .shell {
        width: 94vw;
        height: 88vh;
      }

      .field-grid,
      .scope-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 900px) {
      .shell {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 240px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .toolbar {
        flex-wrap: wrap;
      }

      .toolbar-meta {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body x-data="commissionConfigEditor()" x-init="init()">
  <div class="shell" x-show="visible" x-cloak>
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-tabs">
          <button class="sidebar-tab-btn" type="button" :class="{ active: currentTab === 'global' }" @click="setTab('global')">全局配置</button>
          <button class="sidebar-tab-btn" type="button" :class="{ active: currentTab === 'battle' }" @click="setTab('battle')">战斗配置</button>
          <button class="sidebar-tab-btn" type="button" :class="{ active: currentTab === 'branch' }" @click="setTab('branch')">分支配置</button>
        </div>
        <template x-if="currentTab !== 'global'">
          <input class="search-input" type="text" x-model.trim="searchTerm" :placeholder="currentTab === 'battle' ? '搜索战斗配置委托' : '搜索分支配置委托'">
        </template>
      </div>

      <div class="commission-list">
        <template x-if="!loaded">
          <div class="empty" style="min-height: 160px;">正在加载配置...</div>
        </template>

        <template x-if="loaded && currentTab === 'global'">

  <script>
    function commissionConfigEditor() {
      const DEFAULT_STRATEGY = "根据队伍自动选择";
      const SAVE_TIMEOUT_MS = 5000;
      const LOCATE_TIMEOUT_MS = 30000;

      return {
        globalConfig: {
          uids: [""],
          skipSafeTeleport: false,
        },
        branchData: {},
        partyView: {
          global: {
            battleTeamName: "",
            elementTeamName: "",
            customBattleTeamName: "",
            customElementTeamName: "",
            battleStrategy: DEFAULT_STRATEGY,
          },
          scopesByCommission: {},
        },
        selectedCommission: null,
        loaded: false,
        searchTerm: "",
        currentTab: "global",
        openBattleGroupKey: "",
        saveState: "",
        saveText: "就绪",
        visible: true,
        closing: false,
        saveTimer: null,
        pendingHtmlMaskRequests: {},
        roleSlots: ["1", "2", "3", "4"],
        strategyPicker: {
          open: false,
          loading: false,
          error: "",
          target: null,
          field: "",
          selected: DEFAULT_STRATEGY,
          rootNodes: [],
          rows: [],
        },

        init() {
          if (window.htmlMask) {
            window.htmlMask.onMessage = (message) => this.handleMessage(message);
            this.loadConfig().catch((err) => {
              this.setSaveStatus("error", "加载失败");
              console.error("加载配置失败:", err);
            });
            return;
          }

          this.setSaveStatus("error", "未在 htmlMask 环境中");
        },

        handleMessage(message) {
          if (!message || !message.url) return;

          if (this.resolvePendingHtmlMaskResponse(message)) {
            return;
          }

          if (message.url === "/loadConfig") {
            const payload = message.data && message.data.data ? message.data.data : message.data;
            this.applyConfigPayload(payload || {});
            return;
          }

          if (message.url === "/toggleVisibility") {
            const visible = !message.data || message.data.visible !== false;
            this.applyVisibility(visible);
          }
        },

        normalizePayload(payload) {
          if (payload && (payload.global || payload.branches || payload.party)) {
            return {
              global: this.normalizeGlobalConfig(payload.global || {}),
              branches: this.normalizeBranchMap(payload.branches || {}),
              party: this.normalizePartyView(payload.party || {}),
            };
          }

          return {
            global: this.normalizeGlobalConfig({}),
            branches: this.normalizeBranchMap(payload || {}),
            party: this.normalizePartyView({}),
          };
        },

        async loadConfig() {
          const response = await this.requestHtmlMask("/loadConfig", {}, SAVE_TIMEOUT_MS, "加载超时");
          this.applyConfigPayload(this.unwrapHtmlMaskData(response) || {});
        },

        applyConfigPayload(payload) {
          const normalized = this.normalizePayload(payload || {});
          this.globalConfig = normalized.global;
          this.branchData = normalized.branches;
          this.partyView = normalized.party;
          this.loaded = true;

          this.ensureSelectedCommissionForCurrentTab();
          if (this.selectedCommission) {
            this.ensureBranchDefault(this.selectedCommission);
          }
          this.setSaveStatus("saved", "已加载");
        },

        normalizeGlobalConfig(config) {
          const next = config && typeof config === "object" && !Array.isArray(config) ? config : {};
          const rawUids = Array.isArray(next.uids)
            ? next.uids
            : (typeof next.uid === "string" ? [next.uid] : []);
          const uids = rawUids
            .map((uid) => String(uid ?? "").trim().toLowerCase() === "test" ? "test" : String(uid ?? "").replace(/\D/g, ""))
            .filter(Boolean);

          return {
            uids: uids.length > 0 ? Array.from(new Set(uids)) : [""],
            skipSafeTeleport: next.skipSafeTeleport === true,
          };
        },

        normalizeBranchMap(branches) {
          const next = {};
          if (!branches || typeof branches !== "object" || Array.isArray(branches)) {
            return next;
          }

          Object.keys(branches).forEach((name) => {
            next[name] = this.normalizeBranchConfig(branches[name]);
          });
          return next;
        },

        normalizeBranchConfig(config) {
          const next = config && typeof config === "object" && !Array.isArray(config) ? { ...config } : {};
          next.type = next.type || "achievement";
          next.default = next.default === undefined ? null : next.default;
          next.conditions = next.conditions && typeof next.conditions === "object" && !Array.isArray(next.conditions)
            ? next.conditions
            : {};
          next.descriptions = next.descriptions && typeof next.descriptions === "object" && !Array.isArray(next.descriptions)
            ? next.descriptions
            : {};
          next.completed = Array.isArray(next.completed)
            ? next.completed.filter((item) => typeof item === "string")
            : [];
          next.note = this.sanitizeNoteText(next.note);
          delete next.noteLevel;
          return next;
        },

        normalizePartyView(view) {
          const next = view && typeof view === "object" && !Array.isArray(view) ? view : {};
          const scopesByCommission = next.scopesByCommission && typeof next.scopesByCommission === "object" && !Array.isArray(next.scopesByCommission)
            ? next.scopesByCommission
            : {};
          const normalizedScopes = {};

          Object.keys(scopesByCommission).forEach((commissionName) => {
            const items = Array.isArray(scopesByCommission[commissionName]) ? scopesByCommission[commissionName] : [];
            normalizedScopes[commissionName] = items
              .map((item) => this.normalizeScopeEntry(item, commissionName))
              .sort((a, b) => a.label.localeCompare(b.label, "zh-CN"));
          });

          return {
            global: this.normalizeGlobalPartyConfig(next.global),
            scopesByCommission: normalizedScopes,
          };
        },

        normalizeGlobalPartyConfig(config) {
          const next = config && typeof config === "object" && !Array.isArray(config) ? config : {};
          return {
            battleTeamName: typeof next.battleTeamName === "string" ? next.battleTeamName.trim() : "",
            elementTeamName: typeof next.elementTeamName === "string" ? next.elementTeamName.trim() : "",
            customBattleTeamName: typeof next.customBattleTeamName === "string" ? next.customBattleTeamName.trim() : "",
            customElementTeamName: typeof next.customElementTeamName === "string" ? next.customElementTeamName.trim() : "",
            battleStrategy: typeof next.battleStrategy === "string" && next.battleStrategy.trim()
              ? next.battleStrategy.trim()
              : DEFAULT_STRATEGY,
          };
        },

        normalizeScopeEntry(entry, fallbackCommissionName) {
          const next = entry && typeof entry === "object" && !Array.isArray(entry) ? entry : {};
          const commissionName = typeof next.commissionName === "string" && next.commissionName.trim()
            ? next.commissionName.trim()
            : fallbackCommissionName;
          const locationDir = typeof next.locationDir === "string" ? next.locationDir : "";
          const country = typeof next.country === "string" ? next.country : "";
          const typeDir = typeof next.typeDir === "string" ? next.typeDir : "";

          return {
            key: typeof next.key === "string" && next.key ? next.key : [country, next.type || "", commissionName, locationDir].join("::"),
            country,
            type: typeof next.type === "string" ? next.type : "",
            typeDir,
            commissionName,
            location: typeof next.location === "string" ? next.location : locationDir,
            locationDir,
            ordinal: typeof next.ordinal === "number" ? next.ordinal : null,
            label: typeof next.label === "string" && next.label
              ? next.label
              : [country, typeDir || next.type || "", locationDir].filter(Boolean).join(" | "),
            config: this.normalizeScopeConfig(next.config),
          };
        },

        normalizeScopeConfig(config) {
          const next = config && typeof config === "object" && !Array.isArray(config) ? config : {};
          return {
            battle: this.normalizeBattleConfig(next.battle),
            collect: this.normalizeCollectConfig(next.collect),
          };
        },

        normalizeBattleConfig(config) {
          const next = this.normalizeTeamConfig(config);
          next.strategy = config && typeof config.strategy === "string" && config.strategy.trim()
            ? config.strategy.trim()
            : DEFAULT_STRATEGY;
          return next;
        },

        normalizeCollectConfig(config) {
          return this.normalizeTeamConfig(config);
        },

        normalizeTeamConfig(config) {
          const next = config && typeof config === "object" && !Array.isArray(config) ? config : {};
          return {
            mode: next.mode === "custom" ? "custom" : "global",
            teamMode: next.teamMode === "roles" ? "roles" : "teamName",
            teamName: typeof next.teamName === "string" ? next.teamName.trim() : "",
            customTeamName: typeof next.customTeamName === "string" ? next.customTeamName.trim() : "",
            roles: this.normalizeRoles(next.roles),
          };
        },

        normalizeRoles(roles) {
          const next = {};
          this.roleSlots.forEach((slot) => {
            next[slot] = roles && typeof roles[slot] === "string" ? roles[slot].trim() : "";
          });
          return next;
        },

        sanitizeNoteText(note) {
          if (typeof note !== "string") return "";
          if (!note) return "";

          const hasHtml = /<br\s*\/?>|<[a-z!/][^>]*>/i.test(note);
          if (!hasHtml) return note;

          const normalized = note
            .replace(/<br\s*\/?>/gi, "\n")
            .replace(/<\/(div|p|li|tr|h[1-6])>/gi, "\n");

          const container = document.createElement("div");
          container.innerHTML = normalized;
          return (container.textContent || container.innerText || "")
            .replace(/\r\n/g, "\n")
            .replace(/\n{3,}/g, "\n\n")
            .trim();
        },

        setSaveStatus(state, text) {
          this.saveState = state || "";
          this.saveText = text;
        },

        async locateScope(scope) {
          if (!scope || this.closing) return;
          this.applyVisibility(false);
          this.setSaveStatus("saving", "正在定位...");
          try {
            const response = await this.requestHtmlMask("/locateScope", { scope }, LOCATE_TIMEOUT_MS, "定位超时");
            const payload = this.unwrapHtmlMaskData(response) || {};
            if (payload.status === "error") {
              throw new Error(payload.message || "定位失败");
            }
            this.setSaveStatus("saved", "已发送定位");
          } catch (err) {
            this.setSaveStatus("error", err.message || "定位失败");
          }
        },

        nextHtmlMaskRequestId() {
          if (!window.htmlMask || typeof window.htmlMask._seq !== "number") {
            return "";
          }
          return "__req_" + (window.htmlMask._seq + 1);
        },

        requestHtmlMask(url, data, timeoutMs, timeoutText) {
          if (!window.htmlMask || typeof window.htmlMask.request !== "function") {
            return Promise.reject(new Error("htmlMask request unavailable"));
          }

          const requestId = this.nextHtmlMaskRequestId();
          return new Promise((resolve, reject) => {
            let settled = false;
            let timer = null;
            const cleanup = () => {
              if (timer) {
                clearTimeout(timer);
              }
              if (requestId) {
                delete this.pendingHtmlMaskRequests[requestId];
                if (window.htmlMask && window.htmlMask._callbacks) {
                  delete window.htmlMask._callbacks[requestId];
                }
              }
            };
            const settle = (type, value) => {
              if (settled) return;
              settled = true;
              cleanup();
              if (type === "resolve") {
                resolve(value);
              } else {
                reject(value);
              }
            };

            if (requestId) {
              this.pendingHtmlMaskRequests[requestId] = {
                url,
                resolve: (value) => settle("resolve", value),
                reject: (err) => settle("reject", err),
              };
            }

            if (timeoutMs > 0) {
              timer = setTimeout(() => {
                settle("reject", new Error(timeoutText || "请求超时"));
              }, timeoutMs);
            }

            let nativeRequest;
            try {
              nativeRequest = window.htmlMask.request(url, data || {});
            } catch (err) {
              settle("reject", err);
              return;
            }

            const nativeCallbacks = requestId && window.htmlMask._callbacks
              ? window.htmlMask._callbacks[requestId]
              : null;
            if (nativeCallbacks) {
              window.htmlMask._callbacks[requestId] = {
                resolve: (response) => settle("resolve", response),
                reject: (err) => settle("reject", err),
              };
              return;
            }

            Promise.resolve(nativeRequest)
              .then((response) => settle("resolve", response))
              .catch((err) => settle("reject", err));
          });
        },

        resolvePendingHtmlMaskResponse(message) {
          const requestId = typeof message.requestId === "string"
            ? message.requestId
            : (message.data && typeof message.data.requestId === "string" ? message.data.requestId : "");
          if (!requestId || !this.pendingHtmlMaskRequests[requestId]) {
            return false;
          }

          this.pendingHtmlMaskRequests[requestId].resolve(message);
          return true;
        },

        unwrapHtmlMaskData(response) {
          let payload = response && response.data !== undefined ? response.data : response;
          if (payload && typeof payload === "object" && typeof payload.requestId === "string" && payload.data !== undefined) {
            payload = payload.data;
          }
          return payload;
        },

        saveErrorText(err) {
          const message = err && err.message ? err.message : "";
          return message && message !== "保存失败" ? "保存失败：" + message : "保存失败";
        },

        displayScopeTitle(scope) {
          if (!scope) return "";
          let country = typeof scope.country === "string" ? scope.country.trim() : "";
          let location = typeof scope.locationDir === "string" && scope.locationDir.trim()
            ? scope.locationDir.trim()
            : (typeof scope.location === "string" ? scope.location.trim() : "");

          if ((!country || !location) && typeof scope.key === "string") {
            const keyParts = scope.key.split("::").map((part) => part.trim());
            if (keyParts.length >= 4) {
              country = country || keyParts[0];
              location = location || keyParts[3];
            }
          }

          const title = [country, location].filter(Boolean).join(" | ");
          return title || this.cleanScopeLabel(scope.label || scope.key || "");
        },

        cleanScopeLabel(value) {
          const raw = String(value || "").trim();
          if (raw.includes("::")) {
            const keyParts = raw.split("::").map((part) => part.trim());
            if (keyParts.length >= 4) {
              return [keyParts[0], keyParts[3]].filter(Boolean).join(" | ");
            }
          }

          return raw
            .split("|")
            .map((part) => part.trim())
            .filter((part) => part && !/^(basic|npc)$/i.test(part))
            .join(" | ");
        },

        allCommissionNames() {
          return Array.from(new Set([
            ...Object.keys(this.branchData || {}),
            ...Object.keys(this.partyView.scopesByCommission || {}),
          ])).sort((a, b) => a.localeCompare(b, "zh-CN"));
        },

        branchCommissionNames() {
          return Object.keys(this.branchData || {}).sort((a, b) => a.localeCompare(b, "zh-CN"));
        },

        battleCommissionNames() {
          return Object.keys((this.partyView && this.partyView.scopesByCommission) || {})
            .sort((a, b) => a.localeCompare(b, "zh-CN"));
        },

        filteredBranchCommissions() {
          const searchTerm = this.searchTerm.toLowerCase();
          return this.branchCommissionNames()
            .filter((name) => name.toLowerCase().includes(searchTerm))
            .map((name) => ({
              name,
              progress: this.commissionProgress(this.branchData[name]),
            }));
        },

        battleListGroups() {
          const searchTerm = this.searchTerm.toLowerCase();
          const groupsByCountry = {};
          const basicItems = [];
          const seen = {};
          const scopesByCommission = (this.partyView && this.partyView.scopesByCommission) || {};

          Object.keys(scopesByCommission).sort((a, b) => a.localeCompare(b, "zh-CN")).forEach((name) => {
            if (searchTerm && !name.toLowerCase().includes(searchTerm)) return;
            const scopes = Array.isArray(scopesByCommission[name]) ? scopesByCommission[name] : [];
            const hasBasic = scopes.some((scope) => String(scope.typeDir || scope.type || "").toLowerCase() === "basic");
            const npcCountries = Array.from(new Set(scopes
              .filter((scope) => String(scope.typeDir || scope.type || "").toLowerCase() !== "basic")
              .map((scope) => typeof scope.country === "string" && scope.country.trim() ? scope.country.trim() : "未分类")
            ));

            if (hasBasic) {
              basicItems.push({ name, progress: scopes.length > 1 ? String(scopes.length) : "" });
            }

            npcCountries.forEach((country) => {
              const key = "npc:" + country;
              if (!groupsByCountry[country]) groupsByCountry[country] = [];
              if (!seen[key]) seen[key] = {};
              if (seen[key][name]) return;
              seen[key][name] = true;
              groupsByCountry[country].push({ name, progress: scopes.length > 1 ? String(scopes.length) : "" });
            });
          });

          const npcGroups = Object.keys(groupsByCountry)
            .sort((a, b) => a.localeCompare(b, "zh-CN"))
            .map((country) => ({
              key: "npc:" + country,
              title: country + " NPC",
              items: groupsByCountry[country],
            }));

          return npcGroups.concat({
            key: "basic",
            title: "Basic",
            items: basicItems,
          });
        },

        filteredBattleCount() {
          return this.battleListGroups().reduce((sum, group) => sum + group.items.length, 0);
        },

        toggleBattleGroup(key) {
          this.openBattleGroupKey = this.isBattleGroupOpen(key) ? "__closed__" : key;
        },

        effectiveOpenBattleGroupKey() {
          if (this.openBattleGroupKey === "__closed__") return "";
          const groups = this.battleListGroups().filter((group) => group.items.length > 0);
          if (groups.length === 0) return "";
          if (groups.some((group) => group.key === this.openBattleGroupKey)) {
            return this.openBattleGroupKey;
          }
          return this.searchTerm ? groups[0].key : "";
        },

        isBattleGroupOpen(key) {
          return this.effectiveOpenBattleGroupKey() === key;
        },

        currentTabCommissionNames() {
          if (this.currentTab === "branch") return this.branchCommissionNames();
          if (this.currentTab === "battle") return this.battleCommissionNames();
          return [];
        },

        ensureSelectedCommissionForCurrentTab() {
          if (this.currentTab === "global") {
            this.selectedCommission = null;
            return;
          }

          const names = this.currentTabCommissionNames();
          if (names.length > 0 && (!this.selectedCommission || !names.includes(this.selectedCommission))) {
            this.selectedCommission = names[0];
          } else if (names.length === 0) {
            this.selectedCommission = null;
          }
        },

        setTab(tab) {
          this.currentTab = tab === "battle" || tab === "branch" ? tab : "global";
          this.searchTerm = "";
          if (this.currentTab === "battle" && (!this.openBattleGroupKey || this.openBattleGroupKey === "__closed__")) {
            const firstGroup = this.battleListGroups().find((group) => group.items.length > 0);
            this.openBattleGroupKey = firstGroup ? firstGroup.key : "";
          }
          this.ensureSelectedCommissionForCurrentTab();
          if (this.selectedCommission) {
            this.ensureBranchDefault(this.selectedCommission);
          }
        },

        statusCountText() {
          if (this.currentTab === "global") return "全局配置";
          if (this.currentTab === "battle") return "共 " + this.filteredBattleCount() + " 个战斗配置委托";
          return "共 " + this.filteredBranchCommissions().length + " 个分支配置委托";
        },

        statusPathText() {
          if (this.currentTab === "global") return "process/config/global.json";
          if (this.currentTab === "battle") return "process/config/party";
          return "process/config/branches";
        },

        commissionProgress(config) {
          if (!config) return "";
          const conditions = config.conditions || {};
          const achievementKeys = Object.keys(conditions);
          if (achievementKeys.length === 0) return "";

          const completed = Array.isArray(config.completed)
            ? config.completed.filter((branchId) => achievementKeys.includes(branchId))
            : [];

          return completed.length + "/" + achievementKeys.length;
        },

        selectedBranchConfig() {
          if (!this.selectedCommission) return null;
          return this.branchData[this.selectedCommission] || null;
        },

        selectedPartyScopes() {
          if (!this.selectedCommission) return [];
          return this.partyView.scopesByCommission[this.selectedCommission] || [];
        },

        selectCommission(name) {
          this.selectedCommission = name;
          this.ensureBranchDefault(name);
        },

        ensureBranchDefault(name) {
          const config = this.branchData[name];
          if (!config) return;

          const branches = this.allBranches(config);
          if (branches.length === 0) return;

          if (!config.default || !config.descriptions[config.default]) {
            config.default = branches[0].id;
            this.scheduleSave();
          }
        },

        allBranches(config) {
          return Object.entries((config && config.descriptions) || {}).map(([branchId, description]) => ({
            id: branchId,
            description,
          }));
        },

        achievementBranches(config) {
          const conditions = (config && config.conditions) || {};
          const completed = Array.isArray(config && config.completed) ? config.completed : [];
          return this.allBranches(config)
            .filter((branch) => conditions[branch.id])
            .map((branch) => ({
              id: branch.id,
              description: branch.description,
              completed: completed.includes(branch.id),
            }));
        },

        allCompletedLabel(config) {
          if (!config) return "默认分支";
          if (config.type === "basic") return "选择分支";
          return this.achievementBranches(config).length > 0 ? "全部成就达成后的默认分支" : "默认分支";
        },

        updateAllCompleted(branchId) {
          const config = this.selectedBranchConfig();
          if (!config) return;
          config.default = branchId || null;
          this.scheduleSave();
        },

        addUid() {
          if (this.hasDeveloperTestUid()) {
            this.openDeveloperTest();
            return;
          }
          if (!Array.isArray(this.globalConfig.uids)) {
            this.globalConfig.uids = [""];
          }
          this.globalConfig.uids.push("");
          this.scheduleSave();
        },

        hasDeveloperTestUid() {
          return Array.isArray(this.globalConfig.uids)
            && this.globalConfig.uids.some((uid) => String(uid).trim().toLowerCase() === "test");
        },

        async openDeveloperTest() {
          if (this.closing || !window.htmlMask) return;
          this.closing = true;
          try {
            await this.requestHtmlMask("/openDeveloperTest", {}, SAVE_TIMEOUT_MS, "打开开发者测试超时");
          } catch (err) {
            console.error("打开开发者测试失败:", err);
            this.closing = false;
          }
        },

        removeUid(index) {
          if (!Array.isArray(this.globalConfig.uids)) {
            this.globalConfig.uids = [""];
          }
          this.globalConfig.uids.splice(index, 1);
          if (this.globalConfig.uids.length === 0) {
            this.globalConfig.uids.push("");
          }
          this.scheduleSave();
        },

        updateUid(index, value) {
          if (!Array.isArray(this.globalConfig.uids)) {
            this.globalConfig.uids = [""];
          }
          const raw = String(value || "").trim();
          this.globalConfig.uids[index] = /^[a-z]+$/i.test(raw) ? raw.toLowerCase() : raw.replace(/\D/g, "");
          this.scheduleSave();
        },

        toggleSkipSafeTeleport() {
          this.globalConfig.skipSafeTeleport = !this.globalConfig.skipSafeTeleport;
          this.scheduleSave();
        },

        globalConfigForSave() {
          const rawUids = Array.isArray(this.globalConfig.uids) ? this.globalConfig.uids : [];
          return {
            uids: Array.from(new Set(rawUids.map((uid) => {
              const raw = String(uid || "").trim();
              return raw.toLowerCase() === "test" ? "test" : raw.replace(/\D/g, "");
            }).filter(Boolean))),
            skipSafeTeleport: this.globalConfig.skipSafeTeleport === true,
          };
        },

        toggleBranchState(branchId) {
          const config = this.selectedBranchConfig();
          if (!config) return;
          if (!Array.isArray(config.completed)) {
            config.completed = [];
          }

          const isCompleted = config.completed.includes(branchId);
          config.completed = isCompleted
            ? config.completed.filter((id) => id !== branchId)
            : config.completed.concat(branchId);
          this.scheduleSave();
        },

        setTeamMode(target, mode) {
          target.teamMode = mode === "roles" ? "roles" : "teamName";
          this.scheduleSave();
        },

        scheduleSave() {
          this.setSaveStatus("saving", "修改中...");

          if (this.saveTimer) {
            clearTimeout(this.saveTimer);
          }

          this.saveTimer = setTimeout(() => {
            this.saveTimer = null;
            this.saveConfigNow().catch((err) => console.error("保存失败:", err));
          }, 300);
        },

        async saveConfigNow() {
          if (!window.htmlMask) {
            this.setSaveStatus("error", "运行环境不支持保存");
            return Promise.reject(new Error("no htmlMask"));
          }

          this.setSaveStatus("saving", "保存中...");
          const content = JSON.stringify({
            global: this.globalConfigForSave(),
            branches: this.branchData,
            party: this.partyView,
          }, null, 4);

          try {
            const response = await this.requestHtmlMask("/saveConfig", { content }, SAVE_TIMEOUT_MS, "保存超时");
            const result = this.unwrapHtmlMaskData(response);
            if (!result || typeof result !== "object") {
              throw new Error("未收到保存结果");
            }
            if (result.status !== "ok") {
              throw new Error(result.message || "保存失败");
            }
            this.setSaveStatus("saved", "已保存");
          } catch (err) {
            this.setSaveStatus("error", this.saveErrorText(err));
            throw err;
          }
        },

        async requestClose() {
          if (!window.htmlMask) return;
          this.closing = true;

          if (this.saveTimer) {
            clearTimeout(this.saveTimer);
            this.saveTimer = null;
            try {
              await this.saveConfigNow();
            } catch (err) {
              console.error("关闭前保存失败:", err);
            }
          }

          try {
            await this.requestHtmlMask("/close", {}, SAVE_TIMEOUT_MS, "关闭超时");
          } catch (err) {
            console.error("关闭请求失败:", err);
            this.closing = false;
          }
        },

        applyVisibility(visible) {
          this.visible = visible;
          document.body.style.backgroundColor = visible
            ? "rgba(0, 0, 0, 0.3)"
            : "rgba(0, 0, 0, 0)";
        },

        openStrategyPicker(target, field) {
          this.strategyPicker.open = true;
          this.strategyPicker.loading = true;
          this.strategyPicker.error = "";
          this.strategyPicker.target = target;
          this.strategyPicker.field = field;
          this.strategyPicker.selected = typeof target[field] === "string" && target[field].trim()
            ? target[field].trim()
            : DEFAULT_STRATEGY;
          this.strategyPicker.rootNodes = [];
          this.strategyPicker.rows = [];
          this.loadStrategyTree();
        },

        closeStrategyPicker() {
          this.strategyPicker.open = false;
          this.strategyPicker.loading = false;
          this.strategyPicker.error = "";
        },

        async loadStrategyTree() {
          if (!window.htmlMask) {
            this.strategyPicker.loading = false;
            this.strategyPicker.error = "当前环境不支持读取策略文件";
            return;
          }

          try {
            const response = await this.requestHtmlMask("/loadStrategyTree", {}, SAVE_TIMEOUT_MS, "加载策略列表超时");
            const payload = response && response.data ? response.data : response;
            const result = this.unwrapHtmlMaskData(payload);
            if (result && result.error) {
              throw new Error(result.error);
            }
            this.strategyPicker.rootNodes = this.prepareStrategyNodes((result && result.children) || []);
            this.refreshStrategyRows();
          } catch (err) {
            this.strategyPicker.error = err && err.message ? err.message : "加载策略列表失败";
          } finally {
            this.strategyPicker.loading = false;
          }
        },

        prepareStrategyNodes(entries) {
          return (Array.isArray(entries) ? entries : [])
            .filter((entry) => entry && typeof entry.name === "string" && typeof entry.type === "string")
            .map((entry) => ({
              path: String(entry.name).replace(/\\/g, "/"),
              type: entry.type === "folder" ? "folder" : "file",
              expanded: false,
              loaded: false,
              children: [],
            }))
            .sort((a, b) => {
              if (a.type !== b.type) {
                return a.type === "folder" ? -1 : 1;
              }
              return a.path.localeCompare(b.path, "zh-CN");
            });
        },

        refreshStrategyRows() {
          const rows = [];
          const visit = (nodes, depth) => {
            nodes.forEach((node) => {
              rows.push({
                key: node.path,
                node,
                depth,
              });
              if (node.type === "folder" && node.expanded) {
                visit(node.children || [], depth + 1);
              }
            });
          };
          visit(this.strategyPicker.rootNodes, 0);
          this.strategyPicker.rows = rows;
        },

        async toggleStrategyFolder(node) {
          if (!node || node.type !== "folder") return;

          node.expanded = !node.expanded;
          this.refreshStrategyRows();
          if (!node.expanded || node.loaded) {
            return;
          }

          try {
            const response = await this.requestHtmlMask("/loadStrategyChildren", { path: node.path }, SAVE_TIMEOUT_MS, "读取策略目录超时");
            const payload = response && response.data ? response.data : response;
            const result = this.unwrapHtmlMaskData(payload);
            if (result && result.error) {
              throw new Error(result.error);
            }
            node.children = this.prepareStrategyNodes((result && result.children) || []);
            node.loaded = true;
          } catch (err) {
            node.expanded = false;
            this.strategyPicker.error = err && err.message ? err.message : "读取策略目录失败";
          } finally {
            this.refreshStrategyRows();
          }
        },

        chooseStrategy(path) {
          const target = this.strategyPicker.target;
          const field = this.strategyPicker.field;
          if (!target || !field) return;

          const normalized = this.normalizeStrategyValue(path);
          target[field] = normalized;
          this.strategyPicker.selected = normalized;
          this.scheduleSave();
          this.closeStrategyPicker();
        },

        applyDefaultStrategy() {
          const target = this.strategyPicker.target;
          const field = this.strategyPicker.field;
          if (!target || !field) return;

          target[field] = DEFAULT_STRATEGY;
          this.strategyPicker.selected = DEFAULT_STRATEGY;
          this.scheduleSave();
          this.closeStrategyPicker();
        },

        resetStrategy(target, field) {
          if (!target || !field) return;
          target[field] = DEFAULT_STRATEGY;
          this.scheduleSave();
        },

        normalizeStrategyValue(path) {
          if (path === DEFAULT_STRATEGY) return DEFAULT_STRATEGY;
          return String(path || "")
            .replace(/\\/g, "/")
            .replace(/\.(txt|json)$/i, "");
        },

        strategyNodeLabel(node) {
          const parts = String(node.path || "").split("/");
          return parts[parts.length - 1] || node.path;
        },

        isStrategyRowSelected(node) {
          if (!node || node.type !== "file") return false;
          return this.normalizeStrategyValue(node.path) === this.strategyPicker.selected;
        },
      };
    }
  </script>
</body>
