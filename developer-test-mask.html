<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开发者流程测试</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: rgba(0,0,0,.42); color: #f2f2f2; font-family: "Microsoft YaHei", sans-serif; }
    .panel { width: min(760px, 88vw); max-height: 86vh; overflow: auto; background: rgba(27,29,32,.97); border: 1px solid rgba(255,255,255,.13); border-radius: 8px; box-shadow: 0 18px 55px rgba(0,0,0,.5); }
    header { padding: 22px 26px 18px; border-bottom: 1px solid rgba(255,255,255,.1); }
    h1 { margin: 0 0 6px; font-size: 21px; letter-spacing: 0; }
    .subtitle, .status { color: #9ca3ad; font-size: 13px; }
    form { padding: 24px 26px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; }
    label { display: grid; gap: 7px; font-size: 13px; color: #cfd3d8; }
    label.wide { grid-column: 1 / -1; }
    select, textarea { width: 100%; min-height: 40px; border: 1px solid rgba(255,255,255,.14); border-radius: 6px; background: #17191c; color: #f2f2f2; padding: 8px 10px; font: inherit; }
    textarea { min-height: 88px; resize: vertical; }
    select:disabled, textarea:disabled { opacity: .38; cursor: not-allowed; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 26px 22px; }
    .actions { display: flex; gap: 10px; }
    button { min-height: 38px; border: 1px solid rgba(255,255,255,.15); border-radius: 6px; padding: 0 16px; background: #30343a; color: #fff; cursor: pointer; }
    button.primary { border-color: #3478e5; background: #3478e5; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .error { color: #ef7d7d; }
    @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } label.wide { grid-column: auto; } }
  </style>
</head>
<body>
  <main class="panel">
    <header><h1>开发者流程测试</h1><div class="subtitle">参数来自当前仓库流程目录</div></header>
    <form id="test-form">
      <div class="grid">
        <label>模式<select id="mode"></select></label>
        <label>测试用例<select id="caseName"></select></label>
        <label>国家<select id="country"></select></label>
        <label>委托<select id="commissionName"></select></label>
        <label>地点<select id="location"></select></label>
        <label>流程文件<select id="processFile"></select></label>
        <label class="wide">分支条件（JSON，可选）<textarea id="branchCondition" placeholder='例如 {"type":"completion"}'></textarea></label>
      </div>
    </form>
    <footer>
      <div id="status" class="status">正在读取参数...</div>
      <div class="actions"><button id="close" type="button">关闭</button><button id="run" class="primary" type="submit" form="test-form" disabled>运行测试</button></div>
    </footer>
  </main>
  <script src="./developer-test-mask.js"></script>
</body>
</html>
